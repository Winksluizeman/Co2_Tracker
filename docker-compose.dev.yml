version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: co2-backend-dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8082:8080"
    depends_on:
      - db

  frontend:
    image: ghcr.io/winksluizeman/co2tracker-frontend:latest
    container_name: co2-frontend-dev
    ports:
      - "3000:80"

  db:
    image: postgres:16
    container_name: co2-db-dev
    environment:
      POSTGRES_DB: co2tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data-dev:/var/lib/postgresql/data

volumes:
  db-data-dev:
