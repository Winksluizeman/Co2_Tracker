name: Backend CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: co2tracker
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Appel12
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run tests (JUnit + Testcontainers)
        run: ./gradlew clean test --no-daemon
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/co2tracker
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: Appel12
          SPRING_PROFILES_ACTIVE: test

      - name: Generate JaCoCo coverage report
        run: ./gradlew jacocoTestReport

      - name: Upload JUnit test reports
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: build/test-results/test

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test

  build-and-push:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u winksluizeman --password-stdin

      - name: Build backend image
        run: docker build -t ghcr.io/winksluizeman/co2tracker-backend:${{ github.sha }} .

      - name: Push backend image
        run: docker push ghcr.io/winksluizeman/co2tracker-backend:${{ github.sha }}
