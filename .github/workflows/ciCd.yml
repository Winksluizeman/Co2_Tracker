name: Backend CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: co2tracker
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Appel12
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean build --no-daemon
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/co2tracker
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: Appel12
          SPRING_PROFILES_ACTIVE: test

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u winksluizeman --password-stdin

      - name: Build backend image
        run: docker build -t ghcr.io/winksluizeman/co2tracker-backend:${{ github.sha }} .

      - name: Push backend image
        run: docker push ghcr.io/winksluizeman/co2tracker-backend:${{ github.sha }}

      - name: Copy docker-compose.prod.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/app"

      - name: Deploy on server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/app
            docker login ghcr.io -u winksluizeman -p ${{ secrets.GHCR_TOKEN }}
            docker pull ghcr.io/winksluizeman/co2tracker-backend:${{ github.sha }}
            sed -i "s|IMAGE_TAG|${{ github.sha }}|g" docker-compose.prod.yml
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d
