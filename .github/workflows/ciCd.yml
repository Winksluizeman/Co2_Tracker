name: Backend CI/CD + Quality

on:
  push:
    branches: [ "master" ]
  pull_request:

jobs:

  # ============================================================
  # 1. BUILD + TEST + JACOCO
  # ============================================================
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew clean test --no-daemon --info

      - name: Generate Jacoco report
        run: ./gradlew jacocoTestReport

      - uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: build/test-results/test

      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test


  # ============================================================
  # 2. SONARCLOUD ANALYSIS (Automatic Analysis is UIT)
  # ============================================================
  sonar-analysis:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew sonar \
            -Dsonar.login=${SONAR_TOKEN} \
            -Dsonar.organization=winksluizeman \
            -Dsonar.projectKey=Winksluizeman_Co2_Tracker \
            -Dsonar.host.url=https://sonarcloud.io \
            --info


  # ============================================================
  # 3. BUILD & PUSH DOCKER IMAGE
  # ============================================================
  build-and-push:
    needs: [build-test, sonar-analysis]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            docker-${{ runner.os }}-

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/winksluizeman/co2tracker-backend:latest
            ghcr.io/winksluizeman/co2tracker-backend:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache



  # ============================================================
  # 4. JMETER PERFORMANCE TESTS
  # ============================================================
  jmeter-test:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache JMeter installation
        uses: actions/cache@v4
        with:
          path: jmeter
          key: jmeter-${{ runner.os }}-5.6.2

      - name: Install JMeter if not cached
        run: |
          if [ ! -d "jmeter" ]; then
            sudo apt-get update
            sudo apt-get install -y default-jre
            wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.2.tgz
            tar -xzf apache-jmeter-5.6.2.tgz
            mv apache-jmeter-5.6.2 jmeter
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build backend
        run: ./gradlew build -x test

      - name: Start backend
        run: |
          nohup java -jar build/libs/*.jar --spring.profiles.active=test &
          sleep 10

      - name: Prepare results directory
        run: |
          rm -rf results
          mkdir -p results/report

      - name: Run JMeter testplan
        run: |
          ./jmeter/bin/jmeter \
            -n \
            -t src/tests/performance/testplan.jmx \
            -l results/results.jtl \
            -e -o results/report

      - uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: results/results.jtl

      - uses: actions/upload-artifact@v4
        with:
          name: jmeter-html-report
          path: results/report


  # ============================================================
  # 5. OWASP ZAP SECURITY SCAN (WERKENDE DOCKER-VERSIE)
  # ============================================================
  zap-scan:
    needs: jmeter-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build backend
        run: ./gradlew build -x test

      - name: Build backend Docker image
        run: docker build -t backend-app .

      - name: Create Docker network
        run: docker network create zapnet

      - name: Start backend container
        run: docker run -d --network zapnet --name backend backend-app

      - name: Run ZAP Baseline Scan
        run: |
          docker run --network zapnet \
            --user root \
            -v $(pwd):/zap/wrk:ro \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://backend:8080 \
            -J report_json.json \
            -w report_md.md \
            -r report_html.html \
            -a


      - uses: actions/upload-artifact@v4
        with:
          name: zap-html-report
          path: report_html.html

      - uses: actions/upload-artifact@v4
        with:
          name: zap-md-report
          path: report_md.md

      - uses: actions/upload-artifact@v4
        with:
          name: zap-json-report
          path: report_json.json
