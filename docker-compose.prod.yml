version: "3.9"

services:
  backend:
    image: ghcr.io/winksluizeman/co2tracker-backend:IMAGE_TAG
    container_name: co2-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    image: ghcr.io/winksluizeman/co2tracker-frontend:IMAGE_TAG
    container_name: co2-frontend
    restart: always
    ports:
      - "80:80"

  db:
    image: postgres:16
    container_name: co2-db
    restart: always
    environment:
      POSTGRES_DB: co2tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Appel12
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
